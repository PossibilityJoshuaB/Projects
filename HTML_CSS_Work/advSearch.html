<!DOCTYPE html>
<html lang="en">

<head>
    <title>Search</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <form action="https://www.google.com/search" class="form">
        <div class="formItem">
            <label for="normal">Find pages with all these words:</label>
            <input type="text" name="q">
        </div>

        <div class="formItem">
            <label for="normal">Find pages with these exact words:</label>
            <input type="text" name="q">
        </div>

        <div class="formItem">
            <label for="normal">Find pages with any of these words:</label>
            <input type="text" name="q">
        </div>

        <div class="formItem">
            <label for="normal">Find pages with none of these words:</label>
            <input type="text" name="q">
        </div>

        <input type="submit" value="Advanced Search" class="button">
    </form>

    <div class="link">
        <a href="index.html">Back to Google Search</a>
    </div>
</body>

</html>
